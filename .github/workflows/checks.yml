# First generated by `abatty ci` (next preset); kept by hand since. abatty 0.6.0 regenerates a
# browser job with no Postgres, migrate/seed or production server, a bypass step that is not
# valid YAML, and a scrub step that exits 3 with scrub disabled. Its other 0.6.0 changes are
# applied here: actions pinned to commits, findings/attest failing on a crash, the floors job.
# `abatty ci --check` therefore reads this file as behind; compare with a regenerated copy by hand.
name: checks
on:
  push:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
  id-token: write
  attestations: write
  security-events: write
jobs:
  checks:
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: format
        run: npx prettier --check --end-of-line auto .
      - name: lint (CODE.4)
        run: npm run -s lint
      - name: typecheck (CODE.3)
        run: npm run -s typecheck
      - name: import graph (CODE.5)
        run: npm run -s graph
      - name: dead code (CODE.6)
        run: npm run -s dead
      - name: unit tests (TEST.1)
        run: npm run -s test
      - name: abatty ratchet + changelog range (CHANGE.2)
        run: "git fetch --no-tags origin main && npm run -s standards -- --range origin/main..HEAD"
      - name: secret scan (SEC.1)
        run: "git fetch --no-tags origin main && npx abatty secrets --range origin/main..HEAD"
      - name: audit (SEC.1)
        run: npm audit --audit-level=high --omit=dev
      # The scrub step is omitted: abatty.config.json has scrub.enabled = false (provenance is
      # kept), and the generated step ran the scan unconditionally, failing on every push.
      - name: publish the report to the dashboard
        if: ${{ env.ABATTY_DASHBOARD != '' }}
        env:
          ABATTY_DASHBOARD: ${{ secrets.ABATTY_DASHBOARD }}
          ABATTY_TOKEN: ${{ secrets.ABATTY_TOKEN }}
        run: 'npx abatty publish --to "$ABATTY_DASHBOARD" --token "$ABATTY_TOKEN"'
      - name: the bypass rate of this push
        if: always()
        # A block scalar: the one-line form holds ": " and is not valid YAML.
        run: |
          npx abatty report --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const b=JSON.parse(s).bypass||{};console.log(`bypass: ${b.bypassed||0} of ${b.commits||0} commit(s) got past the hook without saying why (${b.rate||0}%), ${b.reasoned||0} with a reason`);process.exit(b.bypassed?1:0)})"
      - name: findings as SARIF
        if: always()
        run: |
          npx abatty ratchet --range auto --sarif > abatty.sarif || code=$?
          [ "${code:-0}" -eq 0 ] || [ "${code:-0}" -eq 3 ]
          test -s abatty.sarif
      - name: upload the findings
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: abatty.sarif
          category: abatty
      - name: the conformance statement
        if: always()
        run: |
          npx abatty attest --out abatty-conformance.json || code=$?
          [ "${code:-0}" -eq 0 ] || [ "${code:-0}" -eq 3 ]
          test -s abatty-conformance.json
      - name: sign it with this run's identity
        if: always()
        uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc # v2.4.0
        with:
          subject-path: abatty-conformance.json
          predicate-type: https://abatty.dev/attestation/conformance/v1
          predicate-path: abatty-conformance.json
  floors:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: a loosened floor needs a second person's approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx abatty raises --base origin/${{ github.event.pull_request.base.ref }} --require-review ${{ github.event.pull_request.number }}
  database:
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # integration suite against a real Postgres · database suite + coverage (DATA.4, TEST.4): no "test:integration" script in package.json; the gap analysis names it
      - name: "coverage gate (TEST.4) · database suite + coverage (DATA.4, TEST.4)"
        run: npm run -s coverage
  browser:
    needs: checks
    runs-on: ubuntu-latest
    # The browser suite drives the production build against a real Postgres and Redis.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/e2e
      REDIS_URL: redis://localhost:6379
      SEED_ADMIN_EMAIL: admin@e2e.test
      SEED_ADMIN_PASSWORD: e2e-admin-password
      E2E_SERVER_CMD: npm run start
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: migrate and seed the test database
        run: npm run -s db:migrate && npm run -s db:seed
      - name: "build (the browser suite serves the production output) · build + browser suite + axe (TEST.3, A11Y.1)"
        run: npm run -s build
      - name: "E2E · build + browser suite + axe (TEST.3, A11Y.1)"
        run: npm run -s e2e
      - name: keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: test-results/
