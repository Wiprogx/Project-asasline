# Generated by `abatty ci` from the next preset's gate: the same steps, in the same order.
# Regenerate after a gate change; `abatty ci --check` says when this file is behind.
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
  id-token: write
  attestations: write
  security-events: write
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: format
        run: npx prettier --check --end-of-line auto .
      - name: lint (CODE.4)
        run: npm run -s lint
      - name: typecheck (CODE.3)
        run: npm run -s typecheck
      - name: import graph (CODE.5)
        run: npm run -s graph
      - name: dead code (CODE.6)
        run: npm run -s dead
      - name: unit tests (TEST.1)
        run: npm run -s test
      - name: abatty ratchet + changelog range (CHANGE.2)
        run: "git fetch --no-tags origin main && npm run -s standards -- --range origin/main..HEAD"
      - name: secret scan (SEC.1)
        run: "git fetch --no-tags origin main && npx abatty secrets --range origin/main..HEAD"
      - name: audit (SEC.1)
        run: npm audit --audit-level=high --omit=dev
      - name: no trace of the tools (scrub)
        run: npx abatty scrub .
      - name: publish the report to the dashboard
        if: ${{ env.ABATTY_DASHBOARD != '' }}
        env:
          ABATTY_DASHBOARD: ${{ secrets.ABATTY_DASHBOARD }}
          ABATTY_TOKEN: ${{ secrets.ABATTY_TOKEN }}
        run: 'npx abatty publish --to "$ABATTY_DASHBOARD" --token "$ABATTY_TOKEN"'
      - name: the bypass rate of this push
        if: always()
        # A block scalar: the one-line form holds ": " and is not valid YAML.
        run: |
          npx abatty report --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const b=JSON.parse(s).bypass||{};console.log(`bypass: ${b.bypassed||0} of ${b.commits||0} commit(s) got past the hook without saying why (${b.rate||0}%), ${b.reasoned||0} with a reason`);process.exit(b.bypassed?1:0)})"
      - name: findings as SARIF
        if: always()
        run: npx abatty ratchet --range auto --sarif > abatty.sarif || true
      - name: upload the findings
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: abatty.sarif
          category: abatty
      - name: the conformance statement
        if: always()
        run: npx abatty attest --out abatty-conformance.json || true
      - name: sign it with this run's identity
        if: always()
        uses: actions/attest@v2
        with:
          subject-path: abatty-conformance.json
          predicate-type: https://abatty.dev/attestation/conformance/v1
          predicate-path: abatty-conformance.json
  database:
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # integration suite against a real Postgres · database suite + coverage (DATA.4, TEST.4): no "test:integration" script in package.json; the gap analysis names it
      - name: "coverage gate (TEST.4) · database suite + coverage (DATA.4, TEST.4)"
        run: npm run -s coverage
  browser:
    needs: checks
    runs-on: ubuntu-latest
    # src/env.ts validates the environment at startup, so the build needs a URL (never connected to).
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: "build (the browser suite serves the production output) · build + browser suite + axe (TEST.3, A11Y.1)"
        run: npm run -s build
      # E2E + axe · build + browser suite + axe (TEST.3, A11Y.1): no "e2e" script in package.json; the gap analysis names it
